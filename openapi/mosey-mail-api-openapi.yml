openapi: 3.2.0
info:
  title: Mosey Mail API
  x-logo:
    url: null
  version: '1.0'
  description: 'Operations tagged Mail across 2 of this provider''s published API definitions: mosey-openapi.json, mosey-openapi_v2.json. Each path carries the servers of the definition it was published in.'
tags:
- name: Mail
paths:
  /mail:
    get:
      summary: List Mail
      description: 'Returns mail information received by the authorized legal entity


        Follow each returned `url` in order to download the mail content in PDF format'
      operationId: get_legal_entity_mail_handler_mail_get
      security:
      - OAuth2PasswordBearer: []
      - OAuth2PasswordBearer: []
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Start Date
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: End Date
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlatformMail'
                title: Response Get Legal Entity Mail Handler Mail Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Mail
  /v2/mail:
    get:
      summary: List Mail
      description: 'Returns mail information received by the authorized legal entity


        Follow each returned `url` in order to download the mail content in PDF format'
      operationId: get_legal_entity_mail_handler_v2_mail_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Start Date
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: End Date
      - name: region
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/StateCode'
          - type: 'null'
          title: Region
      - name: legal_entity_public_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Legal Entity Public Id
      - name: user_or_platform_public_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: User Or Platform Public Id
      - name: platform_public_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Platform Public Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlatformMail_2'
                title: Response Get Legal Entity Mail Handler V2 Mail Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Mail
