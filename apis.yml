aid: mosey
name: Mosey
description: >-
  Mosey is a business compliance platform that helps multi-state companies open and
  manage state and local tax, HR, payroll, insurance, and registration accounts. The
  Mosey API is a composable set of OpenAPI 3.1 endpoints that let software platforms
  embed state compliance into their own products: sign up or authenticate a legal
  entity, register the states it operates in, generate and resolve compliance tasks,
  receive physical mail, and securely manage state-agency logins via short-lived
  hosted sessions. Authentication is OAuth2 (password grant). Mosey partnered with
  Gusto, Stripe, and Sequoia Consulting Group and was subsequently acquired by Gusto.
  This profile was surfaced as a Canaan Partners portfolio company and enriched by the
  API Evangelist pipeline from Mosey's public OpenAPI and developer documentation.
